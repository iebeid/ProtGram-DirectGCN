name: ppi-env # This is a default name, the user can override it.
channels:
  # Add the nvidia channel to find the CUDA toolkit.
  - nvidia
  - conda-forge
dependencies:
  # --- Base Environment & Libraries from Conda ---
  - python=3.11
  # Pin CUDA to the specific version available on the nvidia channel to resolve matching issues.
  - cudatoolkit=12.1.1
  - cudnn
  - dask
  - tqdm
  - biopython
  - scikit-learn
  - scipy
  - gensim
  - transformers # The HuggingFace library
  - requests
  - pyarrow
  - matplotlib
  - seaborn
  - python-louvain
  - pip