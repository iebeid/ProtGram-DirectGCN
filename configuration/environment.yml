name: ppi-env # This is a default name, the user can override it.
channels:

  - pytorch
  - pyg
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- Core Environment & GPU ---
  - python=3.11
  # Let the solver find a compatible CUDA version for both PyTorch and TensorFlow
  # by requesting the libraries from the same primary channel (conda-forge).
  - cudatoolkit
  - cudnn
  - pytorch
  - torchvision
  - torchaudio
  # The 'tensorflow' package from conda-forge automatically includes GPU support
  # if a CUDA toolkit is present in the environment. 'tensorflow-gpu' is legacy.
  - tensorflow

  # --- PyTorch Geometric ---
  - pyg # Official channel for PyTorch Geometric

  # --- Core Data Science & Bioinformatics ---
  - dask
  - tqdm
  - biopython
  - scikit-learn
  - scipy
  - gensim
  - transformers
  - requests
  - pyarrow

  # --- Plotting & Utilities ---
  - matplotlib
  - seaborn
  - python-louvain

  # --- Pip-specific packages (use only when not on conda) ---
  - pip
  - pip:
    - mlflow
    - pycuda